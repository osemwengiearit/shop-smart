<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shop Smart</title>
  </head>
  <body>
    <header>
      <div class="logo">ShopSmart</div>

      <nav>
        <a href="#">Home</a>
        <a href="#">Shop</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
      </nav>

      <div class="header-actions">
        <input type="search" placeholder="Search products..." />
        <button id="cart-btn">🛒 <span id="cart-count">0</span></button>
      </div>
    </header>

    <section class="hero">
      <div class="hero-text">
        <h1>Discover Amazing Products</h1>

        <p>Shop quality products at affordable prices.</p>

        <button>Shop Now</button>
      </div>

      <div class="hero-image">
        <img src="assets/images/banner.webp" alt="Shopping" />
      </div>
    </section>

    <section class="products">
      <h2>Featured Products</h2>

      <div id="products-container"></div>
    </section>

    <footer>
      <p>© 2026 ShopSmart. All rights reserved.</p>

      <div class="social-links">
        <a href="#">Facebook</a>
        <a href="#">Instagram</a>
        <a href="#">LinkedIn</a>
      </div>

      <p>Email: support@shopsmart.com</p>
    </footer>
  </body>
</html>
