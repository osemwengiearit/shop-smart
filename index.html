<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shop Smart</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <!-- Header -->
    <header>
      <a href="index.html" class="logo">
        <img src="assets/icons/shopsmart-logo.png" alt="ShopSmart Logo" />
        <span>Shop Smart</span>
      </a>

      <nav>
        <a href="index.html">Home</a>
        <a href="product.html">Shop</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
      </nav>

      <div class="header-actions">
        <input type="search" placeholder="Search products..." />

        <a href="cart.html" id="cart-btn">
          <img src="assets/icons/cart.svg" alt="Cart" />
          <span id="cart-count">0</span>
        </a>
      </div>
    </header>

    <!-- Hero -->
    <section class="hero">
      <div class="hero-text">
        <h1>Discover Amazing Products</h1>

        <p>Shop quality products at affordable prices.</p>

        <a href="product.html" class="shop-btn">Shop Now</a>
      </div>

      <div class="hero-image">
        <img src="assets/images/banner.webp" alt="Shopping" />
      </div>
    </section>

    <!-- Categories -->
    <section class="categories">
      <h2>Shop by Category</h2>

      <div class="category-container">
        <div class="category-card">Electronics</div>
        <div class="category-card">Clothes</div>
        <div class="category-card">Furniture</div>
        <div class="category-card">Shoes</div>
      </div>
    </section>

    <!-- Featured Products -->
    <section class="products">
      <h2>Featured Products</h2>

      <div id="products-container"></div>
    </section>

    <!-- Footer -->
    <footer>
      <p>© 2026 ShopSmart. All rights reserved.</p>

      <div class="social-links">
        <a
          href="https://www.linkedin.com/in/osemwengie-arit-bright-a84a28159/"
          target="_blank"
          rel="noopener noreferrer"
        >
          <img src="assets/icons/linkedin.jpg" alt="LinkedIn" />
        </a>

        <a
          href="https://www.instagram.com/arit_bright"
          target="_blank"
          rel="noopener noreferrer"
        >
          <img src="assets/icons/instagram.jpg" alt="Instagram" />
        </a>

        <a
          href="https://facebook.com/osemwengie.arit.bright"
          target="_blank"
          rel="noopener noreferrer"
        >
          <img src="assets/icons/facebook.jpg" alt="Facebook" />
        </a>
      </div>

      <p>Email: support@shopsmart.com</p>
    </footer>

    <script src="js/script.js"></script>
  </body>
</html>
