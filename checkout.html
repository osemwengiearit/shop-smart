<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Checkout | Shop Smart</title>
    <link rel="stylesheet" href="css/checkout.css" />
  </head>

  <body>
    <!-- Header -->
    <header>
      <a href="index.html" class="logo">
        <img src="assets/icons/shopsmart-logo.png" alt="Shop Smart Logo" />
        <span>Shop Smart</span>
      </a>

      <nav>
        <a href="index.html">Home</a>
        <a href="product.html">Shop</a>
        <a href="cart.html">Cart</a>
      </nav>
    </header>

    <!-- Checkout -->
    <main class="checkout">
      <div class="checkout-title">
        <h1>Checkout</h1>
        <p>Complete your order below.</p>
      </div>

      <div class="checkout-container">
        <!-- Checkout Form -->
        <section class="checkout-form">
          <!-- Billing -->
          <div class="form-section">
            <h2>Billing Information</h2>

            <form id="checkout-form">
              <input type="text" id="name" placeholder="Full Name" required />

              <input
                type="email"
                id="email"
                placeholder="Email Address"
                required
              />

              <input
                type="tel"
                id="phone"
                placeholder="Phone Number"
                required
              />

              <input
                type="text"
                id="address"
                placeholder="Street Address"
                required
              />

              <input type="text" id="city" placeholder="City" required />

              <input type="text" id="state" placeholder="State" required />

              <input type="text" id="zip" placeholder="Postal Code" required />
            </form>
          </div>

          <!-- Shipping -->
          <div class="form-section">
            <h2>Shipping Information</h2>

            <label class="checkbox">
              <input type="checkbox" id="same-address" checked />
              Shipping address is the same as billing address
            </label>
          </div>

          <!-- Payment -->
          <div class="form-section">
            <h2>Payment Information</h2>

            <input
              type="text"
              id="card-name"
              placeholder="Name on Card"
              required
            />

            <input
              type="text"
              id="card-number"
              placeholder="Card Number"
              maxlength="19"
              required
            />

            <div class="payment-row">
              <input type="text" id="expiry" placeholder="MM/YY" required />

              <input
                type="text"
                id="cvv"
                placeholder="CVV"
                maxlength="3"
                required
              />
            </div>
          </div>
        </section>

        <!-- Order Summary -->
        <aside class="order-summary">
          <h2>Order Summary</h2>

          <div id="checkout-items">
            <!-- JavaScript will display purchased items here -->
          </div>

          <div class="summary">
            <div class="summary-row">
              <span>Subtotal</span>
              <span id="subtotal">$0.00</span>
            </div>

            <div class="summary-row">
              <span>Shipping</span>
              <span>$10.00</span>
            </div>

            <div class="summary-row total">
              <span>Total</span>
              <span id="total">$10.00</span>
            </div>
          </div>

          <button id="place-order-btn">Place Order</button>
        </aside>
      </div>
    </main>

    <!-- Footer -->
    <footer>
      <p>&copy; 2026 Shop Smart. All Rights Reserved.</p>
    </footer>

    <script src="js/checkout.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
